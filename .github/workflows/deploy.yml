# Compila la web con Astro y la publica en GitHub Pages en cada push a main.
# Si el primer despliegue fallara en "Configurar Pages", activa Pages a mano una vez:
# Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # enablement: activa GitHub Pages (origen "GitHub Actions") si aún no lo está,
      # para no depender del paso manual en Settings → Pages.
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Instalar dependencias
        run: npm ci

      # SITE_URL y BASE_PATH los lee astro.config.mjs:
      #  - URL por defecto: https://<usuario>.github.io + /<repo>
      #  - Dominio propio (configurado en Settings → Pages): https://tudominio.com + ""
      - name: Compilar
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
