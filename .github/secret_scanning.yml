# GitHub secret scanning flags the Firebase web API key in src/firebase.config.json
# as a "Google API key". It is a public client identifier by design: every visitor's
# browser receives it inside the site's JavaScript. What protects the data is the
# key's own restrictions (allowed websites + allowed APIs, managed in the
# youwebit-platform Terraform), Firestore security rules and App Check — not the
# secrecy of the key. Excluding the file avoids a false alert on every rotation.
paths-ignore:
  - "src/firebase.config.json"
